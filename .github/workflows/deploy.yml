name: Deploy frontend to production
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  # A pull request runs the checks only — nothing is deployed from it. Claude
  # opens the pull request, Lionel merges it, and the merge is the deploy
  # (decided 15 October 2026).
  pull_request:
    branches: [main]
    # "edited": a title changed after the checks ran is checked again.
    types: [opened, synchronize, reopened, edited]
    # No paths filter here (3 November 2026). The "protect main" ruleset
    # requires the `test` check; a pull request that touches nothing under
    # app/ (maestro/, .github/dependabot.yml, README) would otherwise never get
    # one and could never be merged. Deploys stay path-filtered: see `push`.
  workflow_dispatch:
concurrency:
  # Deploys queue one behind another and are never cut short. A pull request
  # has its own lane, and a newer push to it replaces the older check.
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'deploy-frontend' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # GIT IS STRICTLY ENGLISH (Lionel, 16 October 2026). The pull request's
      # title becomes the merge commit's message, so it is checked with every
      # commit message. Cyrillic anywhere in them makes the check red; the
      # screen's own words are named in English (or by their i18n key).
      - name: Commit messages and the pull request title are in English
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf 'PR title\t%s\n' "$TITLE"
            gh api --paginate "repos/$REPO/pulls/$PR/commits" \
              --jq '.[] | "\(.sha[0:7])\t\(.commit.message | gsub("\n"; " ⏎ "))"'
          } > "$RUNNER_TEMP/messages.txt"
          python3 - "$RUNNER_TEMP/messages.txt" <<'PY'
          import re, sys
          bad = [l.rstrip('\n') for l in open(sys.argv[1], encoding='utf-8')
                 if re.search('[\\u0400-\\u04FF]', l)]
          for l in bad:
              print(f"::error::Not English: {l[:300]}")
          if bad:
              sys.exit(1)
          print("OK: the title and every commit message are in English.")
          PY
      # LIONEL'S RULE, CHECKED BY THE MACHINE (15 October 2026). app/package.json
      # and app/.gitignore are inputs to the Expo fingerprint: a change to either
      # moves the runtime version, and updates stop reaching the installed
      # phones. Lionel used to look for them in «Files changed» before every
      # merge; now a pull request that touches them is red, and so is a push
      # to main (a second lock, in case one got through some other way). The
      # day a new APK is built on purpose, this step is changed on purpose too.
      - name: app/package.json and app/.gitignore are not touched
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Nothing to compare with (run by hand) — skipped."
            exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"; printf '  %s\n' $CHANGED
          BAD="$(printf '%s\n' "$CHANGED" | grep -xE 'app/package\.json|app/\.gitignore' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Touched: $BAD — the Expo fingerprint would move and updates would stop reaching the phones. Not allowed without a new APK."
            exit 1
          fi
          echo "OK: neither file is touched."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm install --prefer-offline --no-audit --fund=false
      # ONE list of checks, and it lives in app/scripts/gate.mjs — the same
      # command Lionel runs locally. Keeping the steps here as well would put
      # the list in two places, which is the fault this whole evening was
      # spent curing everywhere else.
      #
      # Called directly, NOT through a new npm script: the `scripts` block of
      # package.json is an input to the Expo fingerprint. Measured, not
      # assumed — adding `&& eslint lib scripts` to the lint script moved the
      # fingerprint from cee67fec… to f809e7eb…, and an update published under
      # a runtime version no installed app carries reaches nobody. That cost
      # four releases in a row on 3 August.
      - name: Gate (route types, tsc, lint, eslint, i18n, dates)
        working-directory: app
        run: node scripts/gate.mjs
      # The gate never starts the bundler, and the bundler has
      # its own failures: a broken import path, a missing asset, a module that
      # resolves for the type checker and not for Metro. EXPO_PUBLIC_API_URL is
      # a placeholder — nothing is called, the bundle is only built.
      - name: Bundle
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
        run: npx expo export --platform android
  # SCREENS: main and the pull request photographed side by side.
  #
  # A throwaway server (the server repository's scripts/screens-server.sh)
  # is filled with an invented congregation; both builds of the web app are
  # photographed on this one machine, with the same data and a frozen clock,
  # and the database is put back between them (a screen can write). Changed
  # frames are reported, not failed — changing a screen is often the point.
  # What fails: defects on the pull request's own pictures (text cut off,
  # invisible text, sideways scrolling, raw translation keys, failure screens,
  # console errors, 5xx). See app/scripts/screens-ci.mjs. Pictures and the
  # report are attached to the run; the report is also in its summary.
  #
  # The server comes from the branch of the same name in the server
  # repository when there is one — a change the app needs ships there first —
  # otherwise from its main.
  screens:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: screens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: screens
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
      - name: Does it touch the app at all?
        id: scope
        working-directory: pr
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^app/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under app/ changed: no screens to compare."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout main
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Which server
        if: steps.scope.outputs.run == 'true'
        id: server
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Backmann/mycongregation-server "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"; echo "Server: branch $BRANCH"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"; echo "Server: main"
          fi
      - name: Checkout the server
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: Backmann/mycongregation-server
          ref: ${{ steps.server.outputs.ref }}
          path: server
      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            pr/app/package-lock.json
            base/app/package-lock.json
            server/package-lock.json
      - name: Server — build, migrate, fill
        if: steps.scope.outputs.run == 'true'
        id: seed
        working-directory: server
        run: |
          set -o pipefail
          npm ci --no-audit --fund=false
          npm run build
          scripts/screens-server.sh | tee seed.out
          echo "summary=$(tail -1 seed.out)" >> "$GITHUB_OUTPUT"
      # Installed WITHOUT NODE_ENV=production: that would leave out the dev
      # dependencies, Playwright among them (the first run failed so).
      - name: Install both apps
        if: steps.scope.outputs.run == 'true'
        run: |
          for side in base pr; do
            (cd "$side/app" && npm install --prefer-offline --no-audit --fund=false)
          done
      - name: Build both web apps against it
        if: steps.scope.outputs.run == 'true'
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: http://localhost:3000/api
        run: |
          for side in base pr; do
            (cd "$side/app" && npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/dist-$side")
          done
      - name: Browser
        if: steps.scope.outputs.run == 'true'
        working-directory: pr/app
        run: npx playwright install --with-deps chromium
      - name: Photograph and compare
        if: steps.scope.outputs.run == 'true'
        working-directory: pr/app
        env:
          SUMMARY: ${{ steps.seed.outputs.summary }}
        run: |
          CURRENT="$(node -e 'console.log(JSON.parse(process.env.SUMMARY).current)')"
          node scripts/screens-ci.mjs --a "$GITHUB_WORKSPACE/dist-base" --b "$GITHUB_WORKSPACE/dist-pr" \
            --current "$CURRENT" --out "$GITHUB_WORKSPACE/screens-out" \
            --reset "$GITHUB_WORKSPACE/server/scripts/screens-server.sh restore"
      - name: Report in the summary
        if: always() && steps.scope.outputs.run == 'true'
        run: cat screens-out/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report." >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the pictures
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens-out
          retention-days: 14
      - name: Server log on failure
        if: failure() && steps.scope.outputs.run == 'true'
        run: tail -80 server/server.log || true
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    steps:
      # THE SERVER GOES OUT FIRST (Lionel's rule). With both repositories
      # merged within minutes of each other, the app's deploy is quicker than
      # the server's and would reach the congregation against the old server.
      # So it waits until the live server reports the commit at the head of
      # the server's main — that is, until no server deploy is still on its
      # way. A server deploy that failed stops this one too: an app that needs
      # the new server must not go out without it.
      - name: Wait for the live server to run the server's main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WANT="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Backmann/mycongregation-server/commits/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "Server main: $WANT"
          for i in $(seq 1 120); do
            BODY="$(curl -fsS https://api.mycongregation.org/api/health || true)"
            if echo "$BODY" | grep -q "\"commit\":\"$WANT\""; then
              echo "Live server runs it: $BODY"
              exit 0
            fi
            [ "$i" = 1 ] && echo "Live server is not on it yet — waiting (up to 20 min)."
            sleep 10
          done
          echo "After 20 minutes the live server still does not run $WANT."
          echo "Last answer: $BODY"
          echo "Look at the server's deploy run; the app was NOT deployed."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm install --prefer-offline --no-audit --fund=false
      - name: Clear caches (prevent stale env in bundle)
        working-directory: app
        run: rm -rf .expo node_modules/.cache dist
      - name: Build web bundle
        working-directory: app
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mycongregation.org/api
          EXPO_PUBLIC_VAPID_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_KEY }}
        run: npx expo export --platform web
      - name: Verify bundle
        working-directory: app
        env:
          VAPID_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_KEY }}
        run: |
          BUNDLE=$(ls dist/_expo/static/js/web/entry-*.js | head -1)
          echo "Bundle: $BUNDLE"
          if ! grep -q 'api.mycongregation.org' "$BUNDLE"; then
            echo "FAIL: API URL not embedded in production bundle"
            exit 1
          fi
          if grep -q 'localhost:3000' "$BUNDLE"; then
            echo "FAIL: localhost found in production bundle"
            exit 1
          fi
          if [ -z "$VAPID_KEY" ]; then
            echo "FAIL: EXPO_PUBLIC_VAPID_KEY secret is empty"
            exit 1
          fi
          if ! grep -q "${VAPID_KEY:0:16}" "$BUNDLE"; then
            echo "FAIL: VAPID key not embedded in bundle"
            exit 1
          fi
          echo "Bundle verification passed"
      # What is live, said by the site itself: the commit, and the fingerprint
      # of the app's source — the same number the walkthrough prints, so a
      # green run on a laptop can be matched to what the site serves.
      - name: Stamp the build
        working-directory: app
        run: |
          APP_HASH="$(node scripts/code-fingerprint.mjs)"
          printf '{"commit":"%s","run":%s,"app":{"hash":"%s"},"builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$APP_HASH" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
          cat dist/build-info.json
      - name: Create tarball
        working-directory: app
        run: |
          tar -czf ../web-dist.tar.gz -C dist .
          ls -lh ../web-dist.tar.gz
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'EOF'
          Host myserver
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              IdentityFile ~/.ssh/deploy_key
              UserKnownHostsFile ~/.ssh/known_hosts
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Upload to server
        run: scp -o ConnectTimeout=30 web-dist.tar.gz myserver:/tmp/web-dist.tar.gz
      - name: Extract on server
        run: |
          ssh -o ConnectTimeout=30 myserver bash << 'ENDSSH'
          set -euo pipefail
          echo "=== Replacing files ==="
          cd /var/www/mycongregation
          rm -rf * .[!.]* 2>/dev/null || true
          tar -xzf /tmp/web-dist.tar.gz
          echo "=== Brand check ==="
          grep -c mycongregation login.html || echo "No mycongregation in login.html"
          echo "=== Cleanup ==="
          rm /tmp/web-dist.tar.gz
          echo "=== Done ==="
          ls -la | head -10
          ENDSSH
      # Done when the LIVE site serves this build, not when the copy returned.
      # The query string keeps any cache between here and the files out of it.
      - name: Confirm the live site serves this build
        run: |
          for i in $(seq 1 12); do
            BODY="$(curl -fsS "https://mycongregation.org/build-info.json?v=$GITHUB_SHA" || true)"
            if echo "$BODY" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "Live: $BODY"
              exit 0
            fi
            sleep 5
          done
          echo "The live site does not serve $GITHUB_SHA after 60s. Last answer:"
          echo "$BODY" | head -c 300
          exit 1
      # The page being new does not mean the SERVICE WORKER is: its name never
      # changes, and from 26 June to 8 October 2026 Cloudflare kept handing
      # out the June file under nginx's «immutable» for every .js — eleven
      # changes to it reached no browser while this job stayed green. Asked
      # exactly as a browser asks: no query string, which a cache would take
      # for another file.
      - name: Confirm browsers get this service worker
        run: |
          WANT="$(tr -d '\r' < app/public/service-worker.js | sha256sum | cut -d' ' -f1)"
          for i in $(seq 1 6); do
            GOT="$(curl -fsS https://mycongregation.org/service-worker.js | tr -d '\r' | sha256sum | cut -d' ' -f1 || true)"
            if [ "$GOT" = "$WANT" ]; then
              echo "Service worker live: $GOT"
              exit 0
            fi
            sleep 5
          done
          echo "Browsers are handed ANOTHER service worker than app/public/service-worker.js."
          curl -sI https://mycongregation.org/service-worker.js | grep -iE '^(HTTP|cache-control|cf-cache-status|age|last-modified|content-length)' || true
          echo "Check nginx (location = /service-worker.js must say no-cache) and purge it in Cloudflare."
          exit 1
      - name: Cleanup local
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config web-dist.tar.gz
  # THE UPDATE OVER THE AIR for the installed Android app (15 October 2026:
  # moved here from Lionel's laptop). Same channel as always — `preview`, the
  # one the installed APK listens to; `production` reaches nobody.
  #
  # THE GUARD. An update published under a runtime version no installed app
  # carries reaches nobody, silently (four releases lost that way on
  # 3 August). The runtime is the Expo fingerprint, and on 15 October a clean
  # Linux clone computed cee67fec… where the installed APK carries 6257b64b…
  # — so the runner's own number is NOT trusted. The runtime of the latest
  # update already on `preview` is what the phones run; this job publishes
  # only when its fingerprint equals that, and otherwise stops without
  # publishing anything and says which number it got. A new APK with a new
  # runtime needs its first update published by hand; after that this job
  # matches again.
  ota:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS: npx -y eas-cli@24.8.0
    steps:
      - name: Is there a token at all?
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set — the Android update was NOT published. Publish it by hand."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - name: Setup Node.js
        if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        if: steps.token.outputs.ok == 'true'
        working-directory: app
        run: npm install --prefer-offline --no-audit --fund=false
      # WHY THE CRLF (found 15 October 2026). The installed APK was built
      # from Lionel's Windows checkout, where app/.gitignore still has CRLF
      # line endings (checked out before .gitattributes said eol=lf; git
      # does not rewrite a file it already wrote, and calls it clean). The
      # fingerprint hashes the file as it is on disk: CRLF gives 6257b64b…,
      # the LF in the repository gives cee67fec…, and that file was the ONLY
      # input that differed (all 90-odd others matched hash for hash). So
      # the runner's copy — never the repository's — is given the line
      # endings the APK was built with. The check below still decides: when
      # a new APK is built from LF, it fails here, and this step goes.
      - name: Line endings of app/.gitignore as in the installed APK
        if: steps.token.outputs.ok == 'true'
        working-directory: app
        run: |
          sed -i 's/\r$//; s/$/\r/' .gitignore
          sha1sum .gitignore
      - name: Runtime here and runtime on the phones must be the same
        if: steps.token.outputs.ok == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          npx expo-updates runtimeversion:resolve --platform android 2>/dev/null > /tmp/fp.json
          $EAS update:list --branch preview --platform android --limit 1 --json --non-interactive > /tmp/live.json
          node -e '
            const fs = require("fs");
            const here = JSON.parse(fs.readFileSync("/tmp/fp.json", "utf8")).runtimeVersion;
            // The first runtimeVersion anywhere in the answer: the shape of
            // update:list --json is not relied on beyond that.
            const find = (o) => {
              if (!o || typeof o !== "object") return null;
              if (typeof o.runtimeVersion === "string") return o.runtimeVersion;
              for (const v of Object.values(o)) { const r = find(v); if (r) return r; }
              return null;
            };
            const live = find(JSON.parse(fs.readFileSync("/tmp/live.json", "utf8")));
            console.log("runtime here:      " + here);
            console.log("runtime on phones: " + live);
            if (!here || !live || here !== live) {
              console.log("::error::Runtime differs — the update would reach nobody. NOT published.");
              process.exit(1);
            }
          '
      - name: Export the Android bundle
        if: steps.token.outputs.ok == 'true'
        working-directory: app
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mycongregation.org/api
          EXPO_PUBLIC_VAPID_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_KEY }}
        run: |
          set -euo pipefail
          rm -rf .expo node_modules/.cache dist
          npx expo export --platform android --clear
          # find, not ls: under `set -o pipefail` an ls whose second pattern
          # matches nothing fails the whole step (exit 2, 15 October 2026) —
          # the Android bundle is a single .hbc, there is no .js beside it.
          BUNDLE="$(find dist/_expo/static/js/android -maxdepth 1 -type f \( -name '*.hbc' -o -name '*.js' \) | head -1)"
          [ -n "$BUNDLE" ] || { echo "::error::No Android bundle under dist/_expo/static/js/android"; exit 1; }
          echo "Bundle: $BUNDLE"
          grep -q 'api.mycongregation.org' "$BUNDLE" || { echo "::error::API URL not in the bundle"; exit 1; }
          if grep -q 'localhost:3000' "$BUNDLE"; then echo "::error::localhost in the bundle"; exit 1; fi
      - name: Publish to preview
        if: steps.token.outputs.ok == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          MSG="$(git log -1 --format=%s | cut -c1-200) (${GITHUB_SHA::7})"
          # --skip-bundler: publish THE bundle checked above. Without it
          # eas update runs the bundler again and publishes a fresh one.
          $EAS update --channel preview --input-dir dist --skip-bundler --platform android --message "$MSG" --non-interactive
