name: Deploy frontend to production
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
concurrency:
  group: deploy-frontend
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm install --prefer-offline --no-audit --fund=false
      # Called directly, NOT through a new npm script. The `scripts` block of
      # package.json is one of the inputs to the Expo fingerprint: adding a
      # line there changes the runtime version, and every over-the-air update
      # after it goes to a runtime no installed app has. That cost four
      # releases in a row on 3 August — they published successfully and
      # reached nobody.
      # Route types first: app.json turns typedRoutes on, but the declarations
      # live in .expo/types (gitignored) and nothing here produced them, so
      # every route string was an error and every navigation carries a cast.
      # `expo export` does not write them either — only the dev server does.
      - name: Route types
        working-directory: app
        run: node scripts/gen-route-types.mjs
      - name: Types
        working-directory: app
        run: npx tsc --noEmit
      - name: Lint
        working-directory: app
        run: npm run lint
      # `expo lint` walks only /src, /app and /components. The whole of lib/ —
      # api.ts, auth.tsx, permissions.ts, week-rules.ts, home-timeline.ts, both
      # parsers, every PDF builder — plus scripts/ and public/ was never
      # linted at all. Proved by experiment: a conditional hook, which is an
      # ERROR rule, sat in lib/ and `npm run lint` exited 0.
      - name: Lint everything else
        working-directory: app
        run: npx eslint .
      - name: i18n drift check
        working-directory: app
        run: npm run i18n:check
      - name: UTC date check
        working-directory: app
        run: node scripts/check-dates.mjs
      # The three checks above never start the bundler, and the bundler has
      # its own failures: a broken import path, a missing asset, a module that
      # resolves for the type checker and not for Metro. EXPO_PUBLIC_API_URL is
      # a placeholder — nothing is called, the bundle is only built.
      - name: Bundle
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
        run: npx expo export --platform android
  deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm install --prefer-offline --no-audit --fund=false
      - name: Clear caches (prevent stale env in bundle)
        working-directory: app
        run: rm -rf .expo node_modules/.cache dist
      - name: Build web bundle
        working-directory: app
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mycongregation.org/api
          EXPO_PUBLIC_VAPID_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_KEY }}
        run: npx expo export --platform web
      - name: Verify bundle
        working-directory: app
        env:
          VAPID_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_KEY }}
        run: |
          BUNDLE=$(ls dist/_expo/static/js/web/entry-*.js | head -1)
          echo "Bundle: $BUNDLE"
          if ! grep -q 'api.mycongregation.org' "$BUNDLE"; then
            echo "FAIL: API URL not embedded in production bundle"
            exit 1
          fi
          if grep -q 'localhost:3000' "$BUNDLE"; then
            echo "FAIL: localhost found in production bundle"
            exit 1
          fi
          if [ -z "$VAPID_KEY" ]; then
            echo "FAIL: EXPO_PUBLIC_VAPID_KEY secret is empty"
            exit 1
          fi
          if ! grep -q "${VAPID_KEY:0:16}" "$BUNDLE"; then
            echo "FAIL: VAPID key not embedded in bundle"
            exit 1
          fi
          echo "Bundle verification passed"
      - name: Create tarball
        working-directory: app
        run: |
          tar -czf ../web-dist.tar.gz -C dist .
          ls -lh ../web-dist.tar.gz
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'EOF'
          Host myserver
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              IdentityFile ~/.ssh/deploy_key
              UserKnownHostsFile ~/.ssh/known_hosts
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Upload to server
        run: scp -o ConnectTimeout=30 web-dist.tar.gz myserver:/tmp/web-dist.tar.gz
      - name: Extract on server
        run: |
          ssh -o ConnectTimeout=30 myserver bash << 'ENDSSH'
          set -euo pipefail
          echo "=== Replacing files ==="
          cd /var/www/mycongregation
          rm -rf * .[!.]* 2>/dev/null || true
          tar -xzf /tmp/web-dist.tar.gz
          echo "=== Brand check ==="
          grep -c mycongregation login.html || echo "No mycongregation in login.html"
          echo "=== Cleanup ==="
          rm /tmp/web-dist.tar.gz
          echo "=== Done ==="
          ls -la | head -10
          ENDSSH
      - name: Cleanup local
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config web-dist.tar.gz
