# Ведение встречи и карточки на Главной (20 октября 2026) — на телефоне, на
# живых данных, ТОЛЬКО СМОТРИТ: открывает экраны, ничего не нажимает
# («Начать встречу» не трогается).
# БЕЗ ПЕРЕЗАПУСКА ПРИЛОЖЕНИЯ (20 октября 2026): при новом запуске оно просит
# PIN телефона (своя блокировка, components/AppLock.tsx), и дальше сценарий
# пройти не может. Перед запуском приложение открывают и разблокируют сами;
# сценарий работает в уже открытом.
appId: com.backmann.mycongregation
name: Ведение встречи — только смотреть
---
- openLink: mycongregation://home
- runFlow:
    when:
      visible: "Позже|Later|Später"
    commands:
      - tapOn: "Позже|Later|Später"
- extendedWaitUntil:
    visible: "Главная|Home|Start"
    timeout: 30000
- takeScreenshot: 01-home-cards
- openLink: mycongregation://schedule/conduct?week=2026-10-19
- extendedWaitUntil:
    visible: "Ведение встречи|Conducting the meeting|Zusammenkunft leiten"
    timeout: 30000
- assertNotVisible: ".*(Что-то пошло не так|Something went wrong|Unmatched Route).*"
# The screen first settles into one of its states — the meeting ahead, or its
# result — before the scenario asks which (25 October 2026: asked at once,
# the result was not drawn yet and the run sheet was looked for in vain).
- extendedWaitUntil:
    visible: ".*(Итог встречи|ИТОГ ВСТРЕЧИ|Meeting result|Начать встречу|Start the meeting|Zusammenkunft beginnen).*"
    timeout: 30000
- takeScreenshot: 02-conduct-midweek
# After the meeting's day the screen is its result, which has no run sheet
# (25 October 2026): scrolled only while the meeting is still to come.
- runFlow:
    when:
      notVisible: ".*(Итог встречи|ИТОГ ВСТРЕЧИ|Meeting result|MEETING RESULT|Встреча шла|Meeting took).*"
    commands:
      - scrollUntilVisible:
          element: "Ход встречи|ХОД ВСТРЕЧИ|Run sheet|RUN SHEET|Ablauf|ABLAUF"
          direction: DOWN
          timeout: 10000
- takeScreenshot: 03-conduct-midweek-sheet
- openLink: mycongregation://schedule/conduct?week=2026-10-19&kind=weekend
- extendedWaitUntil:
    visible: "Ведение встречи|Conducting the meeting|Zusammenkunft leiten"
    timeout: 30000
- assertNotVisible: ".*(Что-то пошло не так|Something went wrong|Unmatched Route).*"
# The screen first settles into one of its states — the meeting ahead, or its
# result — before the scenario asks which (25 October 2026: asked at once,
# the result was not drawn yet and the run sheet was looked for in vain).
- extendedWaitUntil:
    visible: ".*(Итог встречи|ИТОГ ВСТРЕЧИ|Meeting result|Начать встречу|Start the meeting|Zusammenkunft beginnen).*"
    timeout: 30000
- takeScreenshot: 04-conduct-weekend
- runFlow:
    when:
      notVisible: ".*(Итог встречи|ИТОГ ВСТРЕЧИ|Meeting result|MEETING RESULT|Встреча шла|Meeting took).*"
    commands:
      - scrollUntilVisible:
          element: "Заключительная.*|Closing.*|Schluss.*"
          direction: DOWN
          timeout: 10000
- takeScreenshot: 05-conduct-weekend-sheet
# «Итоги встреч» (25 October 2026): the one place the results are found.
- openLink: mycongregation://schedule/results
- extendedWaitUntil:
    visible: "Итоги встреч|Meeting results|Ablauf der Zusammenkünfte"
    timeout: 30000
- assertNotVisible: ".*(Что-то пошло не так|Something went wrong|Unmatched Route).*"
- takeScreenshot: 07-results
- pressKey: back
- takeScreenshot: 06-after-back
